<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920">
  <title>마이더스K — 학생부 관리 컨설팅</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="./css/style.css">
  <style>
  #splash {
    position:fixed; inset:0; z-index:99999;
    background:#0D0D1A;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:20px;
    opacity:1; transition:opacity .6s ease;
  }
  #splash.hide { opacity:0; pointer-events:none; }
  .splash-sub  { font-size:11px; font-weight:700; letter-spacing:.3em; color:rgba(255,255,255,0.4); margin-bottom:8px; }
  .splash-title{ font-size:30px; font-weight:700; color:#fff; letter-spacing:.02em; }
  .splash-title span { background:linear-gradient(120deg,#FFB89A,#FF8FB1,#B79CFF);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .splash-dots { display:flex; gap:7px; }
  .splash-dots i { width:7px; height:7px; border-radius:50%; background:#B79CFF;
    animation:splashPulse 1.2s ease-in-out infinite; }
  .splash-dots i:nth-child(2){ background:#FF8FB1; animation-delay:.2s; }
  .splash-dots i:nth-child(3){ background:#FFB89A; animation-delay:.4s; }
  @keyframes splashPulse {
    0%,100%{ opacity:.3; transform:scale(.8); }
    50%    { opacity:1;  transform:scale(1.2); }
  }
  </style>
</head>
<body>
  <div id="splash">
    <div>
      <div class="splash-sub">CONSULTING BOARD</div>
      <div class="splash-title">마이더스K<span>교육컨설팅</span></div>
    </div>
    <div class="splash-dots">
      <i></i><i></i><i></i>
    </div>
  </div>

<div class="app">

  <!-- ═══ 사이드바 ═══ -->
  <div class="sb">
    <div class="sb-logo" onclick="UI.go('rm-overview')" title="전체 보기로 이동">
      <div class="sb-logo-brand" id="sb-brand">MK MIDAS K</div>
      <div class="sb-logo-name"  id="sb-name">학생부 관리 컨설팅</div>
      <div class="sb-logo-sub"   id="sb-sub">Education Consulting</div>
    </div>
    <!-- 사이드바 메뉴 — ui.js renderSidebar()가 동적 생성 -->
    <nav class="sb-nav" id="sb-nav"></nav>
    <!-- 약관·서명 버튼 — 사이드바 하단 고정 -->
    <div style="padding:0 12px 10px;">
      <a href="sign.html" target="_blank"
        style="display:flex;align-items:center;gap:8px;padding:9px 14px;
        background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.13);
        border-radius:7px;color:rgba(255,255,255,0.65);font-size:12.5px;font-weight:600;
        text-decoration:none;transition:background 0.15s;cursor:pointer;"
        onmouseover="this.style.background='rgba(255,255,255,0.13)'"
        onmouseout="this.style.background='rgba(255,255,255,0.07)'">
        <i class="ti ti-writing-sign" style="font-size:15px;"></i>
        가입약관 · 운영방침 서명
      </a>
    </div>
    <div class="sb-foot" id="sb-foot"></div>
  </div>

  <!-- ═══ 메인 ═══ -->
  <div class="main">

    <!-- 탑바 — 3존 구조 -->
    <div class="topbar">

      <!-- 존1: 학생 -->
      <div class="tb-zone-student">
        <div class="tb-student-left">
          <div id="tb-title" class="tb-student-name"
            style="height:36px;display:flex;align-items:center;padding:0 14px;
            background:var(--surface2);border:1.5px solid var(--border);
            border-radius:var(--radius-md);font-size:13px;font-weight:600;
            color:var(--text-3);white-space:nowrap;overflow:hidden;
            text-overflow:ellipsis;box-sizing:border-box;">학생을 선택하세요.</div>
        </div>
        <div class="tb-student-mid">
          <button class="tb-stu-btn" id="student-select-btn" data-tip="불러오기" onclick="UI.openStudentSelectModal()">
            <i class="ti ti-users"></i>
          </button>
          <button class="tb-stu-btn" data-tip="저장" onclick="UI.openSaveStudentModal()">
            <i class="ti ti-device-floppy"></i>
          </button>
          <button class="tb-stu-btn" data-tip="신규상담" onclick="UI.newSession()">
            <i class="ti ti-refresh"></i>
          </button>
          <a href="admin.html" class="tb-stu-btn" data-tip="설정" target="mk-admin"
            style="display:inline-flex;align-items:center;justify-content:center;text-decoration:none;">
            <i class="ti ti-settings-2"></i>
          </a>
        </div>
      </div>

      <div class="tb-divider"></div>

      <!-- 존2: 계산 -->
      <div class="tb-zone-calc">
        <div class="grade-selector">
          <span class="grade-label">학년</span>
          <button class="grade-btn" data-grade="1" onclick="UI.toggleGrade(1)">고1</button>
          <button class="grade-btn" data-grade="2" onclick="UI.toggleGrade(2)">고2</button>
          <button class="grade-btn" data-grade="3" onclick="UI.toggleGrade(3)">고3</button>
        </div>
        <div class="tb-divider-sm"></div>
        <div class="total-boxes">
          <div class="total-box">
            <i class="ti ti-map"></i>
            <div class="total-inner">
              <div class="total-label">로드맵</div>
              <div class="total-amt" id="total-roadmap">0원</div>
            </div>
          </div>
          <div class="total-box">
            <i class="ti ti-user-check"></i>
            <div class="total-inner">
              <div class="total-label">개별</div>
              <div class="total-amt" id="total-individual">0원</div>
            </div>
          </div>
          <div class="total-box">
            <i class="ti ti-target"></i>
            <div class="total-inner">
              <div class="total-label">대입전략</div>
              <div class="total-amt" id="total-strategy">0원</div>
            </div>
          </div>
          <div class="total-box total-sum">
            <i class="ti ti-sigma"></i>
            <div class="total-inner">
              <div class="total-label">총합계</div>
              <div class="total-amt" id="total-sum">0원</div>
            </div>
          </div>
        </div>
        <div class="tb-divider-sm"></div>
        <div class="pkg-btns">
          <div style="display:flex;flex-direction:column;gap:4px;">
            <button class="pkg-btn pkg-btn-1" onclick="UI.applyPackage(1)">로드맵 DC</button>
            <button class="pkg-btn pkg-btn-select" onclick="UI.applySelectDc()">선택가 DC</button>
          </div>
          <div style="display:flex;flex-direction:column;gap:4px;">
            <button class="pkg-btn pkg-btn-2" onclick="UI.applyPackage(2)">개별 DC</button>
            <button class="pkg-btn pkg-btn-semester" onclick="UI.applySemesterDc()">2학기 DC<br><span class="sem-amt" style="font-size:10px;opacity:0.8;">-0만원</span></button>
          </div>
        </div>
      </div>

      <div class="tb-divider"></div>

      <!-- 존3: 액션 -->
      <div class="tb-zone-action">
        <button class="btn btn-primary" onclick="Portfolio.open()">
          <i class="ti ti-clipboard-list"></i> 포트폴리오
        </button>
        <a href="sign.html" target="_blank" class="btn"
          style="display:inline-flex;align-items:center;gap:6px;text-decoration:none;"
          title="가입약관 · 운영방침 서명">
          <i class="ti ti-writing-sign"></i> 서명
        </a>
        <button class="btn" id="admin-lock-btn" onclick="UI.toggleAdminMode()" title="관리자 모드">
          <i class="ti ti-lock" id="admin-lock-icon"></i>
        </button>
      </div>

    </div>

    <!-- 콘텐츠 — ui.js renderPages()가 동적 생성 -->
    <div class="content" id="content"></div>

  </div><!-- /main -->
</div><!-- /app -->

<!-- ═══ JS 로드 순서 중요 ═══ -->
<script src="js/config.js"></script>
<script src="js/store.js"></script>
<script src="js/calc.js"></script>
<script src="js/ui.js"></script>
<script src="js/portfolio.js"></script>

<!-- 사이드바 하단 정보 동적 삽입 -->
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const c = MK_CONFIG.app;
    document.getElementById('sb-brand').textContent = c.brandName;
    document.getElementById('sb-name').textContent  = '마이더스K교육컨설팅';
    document.getElementById('sb-sub').textContent   = 'CONSULTING BOARD';
    document.getElementById('sb-foot').innerHTML    =
      `<strong>${c.license.split(' ').slice(0,2).join(' ')}</strong><br>${c.license}<br>${c.copyright}`;
  });
</script>

  <div id="tb-tooltip"></div>
  <script>
  (function(){
    var s = document.getElementById('splash');
    setTimeout(function(){
      s.classList.add('hide');
      setTimeout(function(){ s.style.display='none'; }, 650);
    }, 2000);
  })();
  </script>
  <script>
  (function(){
    var tip = document.getElementById('tb-tooltip');
    document.querySelectorAll('.tb-stu-btn[data-tip]').forEach(function(btn){
      btn.addEventListener('mouseenter', function(e){
        tip.textContent = btn.getAttribute('data-tip');
        tip.style.opacity = '1';
      });
      btn.addEventListener('mousemove', function(e){
        tip.style.left = (e.clientX - tip.offsetWidth/2) + 'px';
        tip.style.top  = (e.clientY - tip.offsetHeight - 10) + 'px';
      });
      btn.addEventListener('mouseleave', function(){
        tip.style.opacity = '0';
      });
    });
  })();
  </script>
</body>
</html>
